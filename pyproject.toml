[project]
name = "meolac-service"
version = "0.1.0"
description = "REST API for Uyên Thư Các, the personal comic bookshelf"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.20.0",
    "argon2-cffi>=25.1.0",
    "asyncpg>=0.31.0",
    "email-validator>=2.3.0",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "pillow>=12.3.0",
    "pydantic-settings>=2.15.0",
    "pyjwt>=2.15.0",
    "python-multipart>=0.0.32",
    "sqlalchemy[asyncio]>=2.0",
    "tzdata>=2026.4",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "uvicorn[standard]>=0.54.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"

[tool.vercel]
# the FastAPI app Vercel serves (its framework preset would otherwise pick the first app/main.py-like file)
entrypoint = "app.main:app"
